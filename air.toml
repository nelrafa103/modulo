root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/main ."
  bin = "./tmp/main"
  pre_cmd = ["cd web && pnpm run build"]
  include_ext = ["go", "tpl", "tmpl", "html", "ts", "tsx", "js", "jsx", "css", "json"]
  exclude_dir = ["tmp", "vendor", "node_modules", "dist", "web/dist"]
  delay = 1000
  stop_on_error = true
  send_interrupt = true
  kill_delay = "500ms"

[log]
  time = true

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true